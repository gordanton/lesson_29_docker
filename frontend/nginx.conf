server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/multiply/6/7  ->  http://backend:5000/multiply/6/7
    # backend — имя сервиса из docker-compose.yml, его резолвит внутренняя DNS Compose.
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
